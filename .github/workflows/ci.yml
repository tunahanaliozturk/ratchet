name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: lint, types, import contracts, licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests examples benchmarks
      - run: uv run lint-imports
      - run: uv run python tools/license_audit.py

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run pytest tests/unit -q

  integration:
    name: integration (Postgres in a container, crash property, real SIGKILL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: docker pull postgres:18.6-alpine
      - run: uv run pytest tests/integration -q

  vulnerabilities:
    name: known vulnerabilities in dependencies and the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements.txt
      - run: uvx pip-audit --requirement requirements.txt --disable-pip --no-deps --strict
      - run: docker build --tag ratchet:scan .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ratchet:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  quickstart:
    name: README quick start against the compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - run: uv run --no-project python tools/smoke.py
      - if: failure()
        run: docker compose logs
