name: bench

# Run by hand. Publishes the same numbers as docs/benchmark-results, measured on a Linux runner instead of a laptop.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ratchet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ratchet"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: lscpu | head -20
      - run: uv run python -m benchmarks.throughput --dsn postgresql://postgres:postgres@127.0.0.1:5432/ratchet | tee bench.md
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bench
          path: bench.md
