# Local stack: Postgres, a one-shot migration, the API, and two workers sharing the work.
# The token and password below are for this laptop stack only.
name: ratchet

x-ratchet: &ratchet
  image: ratchet:local
  environment: &env
    RATCHET_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ratchet
    RATCHET_APP: examples.orders:registry
    RATCHET_API_TOKEN: local-dev-token

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ratchet
    volumes:
      # postgres 18 keeps its data under a versioned directory below this path.
      - postgres:/var/lib/postgresql
    ports: ["127.0.0.1:55434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ratchet"]
      interval: 2s
      retries: 30

  migrate:
    <<: *ratchet
    build: .
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *ratchet
    ports: ["127.0.0.1:8200:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      # The slim image has no curl; Python is already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 3s
      retries: 20

  worker:
    <<: *ratchet
    command: ["worker"]
    environment:
      <<: *env
      RATCHET_CONCURRENCY: "64"
    deploy:
      replicas: 2
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  postgres:
